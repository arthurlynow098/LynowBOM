services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: lynowbom
      MYSQL_USER: lynow
      MYSQL_PASSWORD: lynow
      MYSQL_ROOT_PASSWORD: lynow-root
    volumes:
      - lynowbom-dados:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-ulynow", "-plynow"]
      interval: 5s
      retries: 20

  app:
    build: .
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_URL: jdbc:mysql://mysql:3306/lynowbom?useUnicode=true&characterEncoding=utf8
      DB_USER: lynow
      DB_PASSWORD: lynow
    ports:
      - "8080:8080"

volumes:
  lynowbom-dados:
