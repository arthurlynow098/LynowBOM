spring:
  application:
    name: lynowbom
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/lynowbom?createDatabaseIfNotExist=true&useUnicode=true&characterEncoding=utf8}
    username: ${DB_USER:lynow}
    password: ${DB_PASSWORD:lynow}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}
  error:
    include-message: always

---
# Perfil sem instalação: banco H2 em memória e planilha de exemplo carregada.
spring:
  config:
    activate:
      on-profile: demo
  datasource:
    url: jdbc:h2:mem:lynowbom;MODE=MySQL;DATABASE_TO_LOWER=TRUE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: create-drop
